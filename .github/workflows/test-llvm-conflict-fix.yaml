name: Test LLVM Conflict Fix
on:
  push:
    branches:
      - llvm-commandline-fix
  workflow_dispatch:

env:
  TI_CI: "1"
  TI_SKIP_VERSION_CHECK: 'ON'

jobs:
  build_m1_test:
    name: Build M1 for LLVM Conflict Testing
    timeout-minutes: 30
    defaults:
      run:
        shell: '/usr/bin/arch -arch arm64e /bin/bash --noprofile --norc -eo pipefail {0}'
    runs-on: [self-hosted, online, m1]
    env:
      TAICHI_CMAKE_ARGS: >-
        -DTI_WITH_OPENGL:BOOL=OFF
        -DTI_WITH_CUDA:BOOL=OFF
        -DTI_WITH_VULKAN:BOOL=ON
        -DTI_BUILD_TESTS:BOOL=ON
        -DTI_WITH_C_API=ON
        -DTI_WITH_STATIC_C_API=ON
      PLATFORM: 'm1'
    steps:
      - name: Workaround checkout Needed single revision issue
        run: git submodule foreach 'git rev-parse HEAD > /dev/null 2>&1 || rm -rf $PWD' || true

      - uses: actions/checkout@v3
        with:
          fetch-depth: '0'
          submodules: 'recursive'

      - name: Build
        run: |
          brew install molten-vk
          ./build.py --python=3.11

      - name: Upload Built Wheel for Testing
        uses: actions/upload-artifact@v4
        with:
          name: taichi-llvm-conflict-fix-m1
          path: 'dist/*.whl'
          retention-days: 7